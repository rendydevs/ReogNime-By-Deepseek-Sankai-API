<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3ece1" />
    <meta
      name="description"
      content="Nonton anime subtitle Indonesia terbaru: tayang, tamat, jadwal rilis, genre, dan pencarian cepat. Streaming sub indo tanpa ribet di ReogNime."
    />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <title>ReogNime — Nonton Anime Sub Indo Tanpa Ribet</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://s4.anilist.co" crossorigin />
    <link rel="preconnect" href="https://www.sankavollerei.web.id" crossorigin />
    <link rel="preconnect" href="https://i1.wp.com" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ReogNime" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="ReogNime — Nonton Anime Sub Indo Tanpa Ribet" />
    <meta
      property="og:description"
      content="Nonton anime subtitle Indonesia terbaru: tayang, tamat, jadwal rilis, genre, dan pencarian cepat."
    />
    <meta property="og:url" content="https://www.reognime.site/" />
    <meta property="og:image" content="https://www.reognime.site/og-reognime.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ReogNime — nonton anime subtitle Indonesia" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReogNime — Nonton Anime Sub Indo Tanpa Ribet" />
    <meta
      name="twitter:description"
      content="Nonton anime subtitle Indonesia terbaru: tayang, tamat, jadwal rilis, genre, dan pencarian cepat."
    />
    <meta name="twitter:image" content="https://www.reognime.site/og-reognime.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.reognime.site/#website",
            "url": "https://www.reognime.site/",
            "name": "ReogNime",
            "alternateName": "ReogNime Sub Indo",
            "description": "Nonton anime subtitle Indonesia terbaru dengan antarmuka minimalis.",
            "inLanguage": "id-ID",
            "publisher": { "@id": "https://www.reognime.site/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://www.reognime.site/search?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://www.reognime.site/#organization",
            "name": "ReogNime",
            "url": "https://www.reognime.site/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.reognime.site/logo.png"
            }
          }
        ]
      }
    </script>

    <script>
      (() => {
        try {
          const stored = localStorage.getItem('reognime-theme');
          const theme = stored === 'light' || stored === 'dark' ? stored : 'light';
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#1a1713' : '#f3ece1');
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width: 760px; margin: 48px auto; padding: 0 20px; font-family: sans-serif">
        <h1>ReogNime — Nonton Anime Sub Indo</h1>
        <p>ReogNime adalah katalog anime subtitle Indonesia dengan daftar tayang, tamat, jadwal rilis, genre, dan pencarian judul.</p>
        <p>
          <a href="/ongoing">Anime tayang</a> · <a href="/completed">Anime tamat</a> ·
          <a href="/schedule">Jadwal rilis</a> · <a href="/genres">Genre</a> ·
          <a href="/all">Semua anime A–Z</a> · <a href="/search">Cari anime</a>
        </p>
        <p>Aktifkan JavaScript untuk membuka katalog dan player.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
